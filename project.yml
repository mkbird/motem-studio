name: MotemStudio
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.motem
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    branch: main
  SwiftGodotKit:
    path: ../../SwiftGodotKit
  SwiftGodot:
    path: ../../SwiftGodot

targets:
  MotemStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources/MotemStudio
        excludes:
          - "Resources/MotemStudio.entitlements"
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: SwiftGodotKit
        product: SwiftGodotKit
      - package: SwiftGodot
        product: SwiftGodot
      - target: MotemMCPBridge
        copy:
          destination: resources
    info:
      path: Sources/MotemStudio/Resources/Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        CFBundleDisplayName: Motem Studio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleDevelopmentRegion: en
        NSHumanReadableCopyright: "© 2026 Motem"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motem.studio
        PRODUCT_NAME: MotemStudio
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/MotemStudio/Resources/MotemStudio.entitlements
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  MotemMCPBridge:
    type: tool
    platform: macOS
    sources:
      - path: Sources/MotemMCPBridge
    settings:
      base:
        PRODUCT_NAME: motem-mcp-bridge
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: NO
