name: MotemStudio
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.motem
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    branch: main
  SwiftGodotKit:
    path: ../../SwiftGodotKit
  SwiftGodot:
    path: ../../SwiftGodot

targets:
  MotemStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources/MotemStudio
        excludes:
          - "Resources/MotemStudio.entitlements"
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: SwiftGodotKit
        product: SwiftGodotKit
      # SwiftGodot ships as a dynamic library — it has to be embedded
      # so the .app can resolve @rpath/SwiftGodot.framework once it's
      # moved out of the DerivedData build folder (DMG, /Applications).
      - package: SwiftGodot
        product: SwiftGodot
        embed: true
      - target: MotemMCPBridge
        copy:
          destination: resources
    info:
      path: Sources/MotemStudio/Resources/Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        CFBundleDisplayName: Motem Studio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleDevelopmentRegion: en
        NSHumanReadableCopyright: "© 2026 Motem"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        NSCameraUsageDescription: Motem Studio uses the front camera to drive body-pose / face-tracking gameplay in the preview pane, mirroring how the same game is controlled on iPhone. The camera only turns on while you are previewing a body-pose game.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motem.studio
        PRODUCT_NAME: MotemStudio
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/MotemStudio/Resources/MotemStudio.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # Sign with Developer ID Application so the app is trusted by
        # Gatekeeper outside the user's own machine. `--timestamp` is
        # required by `xcrun notarytool`, but Apple's TSA needs a live
        # Apple ID auth in the keychain to issue tokens — Debug skips
        # it so local builds aren't blocked when the TSA refuses.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: X4BPFGFQXD
        CODE_SIGN_IDENTITY: "Developer ID Application: DONGPENG MA (X4BPFGFQXD)"
      configs:
        Debug:
          OTHER_CODE_SIGN_FLAGS: "--options runtime"
        Release:
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options runtime"
          # Notarisation rejects any binary carrying
          # `com.apple.security.get-task-allow`. Xcode auto-injects
          # that for debuggability when this flag is YES (the macOS
          # default); we explicitly turn it off for Release so the
          # entitlements file is the sole source of truth.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  MotemMCPBridge:
    type: tool
    platform: macOS
    sources:
      - path: Sources/MotemMCPBridge
    settings:
      base:
        PRODUCT_NAME: motem-mcp-bridge
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: NO
        # The helper binary lives inside `.app/Contents/Resources/`
        # and must carry the same Developer ID signature for
        # notarisation to accept the bundle as a whole.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: X4BPFGFQXD
        CODE_SIGN_IDENTITY: "Developer ID Application: DONGPENG MA (X4BPFGFQXD)"
      configs:
        Debug:
          OTHER_CODE_SIGN_FLAGS: "--options runtime"
        Release:
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options runtime"
          # Same get-task-allow rejection as the main app — disable
          # Xcode's auto-inject for Release so the helper binary
          # carries no notarisation-blocking entitlement.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
